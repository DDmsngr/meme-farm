name: post-meme

on:
  # расписание пингует cron-job.org (workflow_dispatch), GH cron на 15-мин интервале
  # ненадёжен на free-раннерах, поэтому убран отсюда
  workflow_dispatch:

concurrency:
  group: post-meme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install --quiet yt-dlp

      - name: Post one meme
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI: ${{ secrets.GEMINI }}
        run: node src/index.mjs

      - name: Commit dedup
        run: |
          if git diff --quiet dedup.json; then
            echo "no dedup changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dedup.json
          git commit -m "chore: update dedup [skip ci]"
          git push
